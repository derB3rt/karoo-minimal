name: Android APK v0.4 (debug)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karoo-minimal-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.4.0-beta.1"
          cp app/build/outputs/apk/debug/app-debug.apk Karoo-Minimal-v0.4.0-debug.apk
          APK="Karoo-Minimal-v0.4.0-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Karoo Minimal v0.4.0 (Testversion)" \
              --notes "v0.4.0: kompakte Dreifach-Datenleiste (Geschwindigkeit, Kadenz, Puls). Originale Karoo-Navigation bleibt unverändert. Android-APK gebaut, aber Hardware-Test steht noch aus. Die 180-m-Abbiegebox existiert nur im Simulator und wird auf dem Karoo durch die native Navigation gesteuert." \
              --prerelease
          fi
